version = 1

[envs.nextflow]
channels = ["conda-forge", "bioconda"]
dependencies = { nextflow = "*", nf-test = "*" }
exposed = { nextflow = "nextflow", nf-test = "nf-test", java = "java" }

[envs.vim-language-server]
channels = ["conda-forge", "bioconda"]
dependencies = { vim-language-server = "*" }
exposed = { vim-language-server = "vim-language-server" }

[envs.quarto]
channels = ["conda-forge", "bioconda"]
dependencies = { quarto = "*", python = "3.12.*", ipython = "*", jupyter = "*", pandas = "*", palmerpenguins = "*", papermill = "*", pyright = "*", r-base = "*", r-languageserver = "*", r-palmerpenguins = "*", r-rmarkdown = "*", r-tidyverse = "*", scanpy = "*", harmonypy = "*", leidenalg = "*", spatialdata = "*", zarr = ">=2.16,<3", scanorama = "*" , spatialdata-io = "*"}
exposed = { python = "python", ipython = "ipython", pyright-langserver = "pyright-langserver", jupyter-notebook = "jupyter-notebook", quarto = "quarto",  R = "R", Rscript = "Rscript"}
