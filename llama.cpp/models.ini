; Model presets for `llama-server` in router mode, run by the launchd service in
; `launchd/org.llama-cpp.server.plist`; models are named as in the OpenCode
; config (`agent-sandbox/opencode/opencode.json`) Restart the service after
; changes with `launchctl kickstart -k gui/$(id -u)/org.llama-cpp.server`.
; Individual model settings come from the model's recommended settings. Model
; and quantisation choice comes from a 2023 M2 Max 64 GB RAM MacBook Pro.

version = 1

; Shared by all models. Each of the 4 parallel slots gets its own KV cache of
; `ctx-size` ÷ `parallel` tokens (64k here), so that conversations can't run out
; of context because of each other; OpenCode needs at least 64k tokens. The
; prompt cache gets 16 GiB of RAM to keep long agent prompts cached.
[*]
parallel = 4
kv-unified = false
ctx-size = 262144
cache-ram = 16384

; Dense model (27B). `medium` reasoning effort (second highest, default) to
; shorten the thinking, while `xhigh` is the highest.
[qwen3.8-27b]
hf-repo = unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_M
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
chat-template-kwargs = {"reasoning_effort":"medium"}

; MoE model (35B total, 3B active), with thinking. 128k tokens only need about
; 2.5 GiB of KV cache, as only 10 of the 40 layers use full attention, so all
; four slots get 128k. Earlier reasoning is kept in the prompt, as recommended
; for agents.
[qwen3.6-35b-a3b]
hf-repo = unsloth/Qwen3.6-35B-A3B-GGUF:UD-Q6_K
ctx-size = 524288
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.0
chat-template-kwargs = {"preserve_thinking":true}

; MoE model (80B total, 3B active), without thinking, made for agentic coding.
; 128k tokens only need about 3 GiB of KV cache, as only 12 of the 48 layers use
; full attention, but only two such slots fit, so further parallel requests wait
; for a free slot. The prompt cache is halved to leave memory for macOS.
[qwen3-coder-next]
hf-repo = unsloth/Qwen3-Coder-Next-GGUF:UD-IQ4_XS
parallel = 2
ctx-size = 262144
cache-ram = 8192
temp = 1.0
top-p = 0.95
top-k = 40
